<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef3d7c">
<title>カラフル日記</title>
<style>
:root{--ink:#2d2d2d;--pink:#ef3d7c;--cream:#fff8e8;--line:#353535;--soft:#fff1f6;--yellow:#fff7c9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--cream);color:var(--ink);font-size:18px;line-height:1.65}
header{position:sticky;top:0;z-index:10;background:var(--pink);color:white;padding:14px 18px;box-shadow:0 2px 8px #0002}header h1{margin:0;font-size:1.55rem}.sub{font-size:.9rem;opacity:.95}
main{max-width:820px;margin:auto;padding:18px}.box,.card{background:white;border:4px solid var(--line);border-radius:26px;padding:22px;margin:16px 0}.box h2{margin-top:0}
label{display:block;font-weight:800;margin:14px 0 5px}input,select,textarea,button{font:inherit}input[type=date],select,textarea,input[type=file]{width:100%;border:3px solid #aaa;border-radius:14px;padding:12px;background:white}textarea{min-height:150px;resize:vertical}
button,.linkbtn{border:3px solid var(--line);background:white;border-radius:16px;padding:11px 15px;font-weight:800;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}.primary{background:var(--pink);color:white;border-color:#b72258}.danger{background:#fff0f0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.hint{color:#666;font-size:.93rem}.msg{font-weight:800;margin-top:10px}.photoPreview,.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.photoPreview img,.photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:2px solid #bbb}.photoPreview button{width:100%;margin-top:3px;padding:5px;font-size:.8rem}.card.favorite{background:#fffdf0}.card h3{margin:0 0 4px}.meta{color:#666;font-weight:700;margin-bottom:10px}.body{white-space:pre-wrap}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{background:var(--yellow);border-radius:18px;padding:14px;margin-top:12px}.toprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.small{font-size:.85rem}.count{font-weight:800}
@media(max-width:600px){body{font-size:17px}main{padding:12px}.box,.card{padding:16px;border-width:3px}.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.photoPreview,.photos{grid-template-columns:repeat(2,1fr)}button,.linkbtn{width:100%}.toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}}
@media print{header,.noPrint,.toolbar,.filters,.migration{display:none!important}body{background:white}.box,.card{border:0;padding:0}.card{break-inside:avoid;border-bottom:1px solid #bbb;border-radius:0;padding:14px 0}.photos img{max-height:260px;object-fit:contain}.photos{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>📔 カラフル日記</h1><div class="sub">思い出・気分・写真を、学び帳とは別に保存</div></header>
<main>
<div class="toprow noPrint"><a class="linkbtn" href="../index.html">← ダンダン学び帳へ</a><button onclick="showView('write')">✏️ 書く</button><button onclick="showView('list')">📚 日記を見る</button></div>

<section id="migration" class="box migration noPrint">
<h2>🚚 旧日記の移行</h2>
<p class="hint">旧ダンダン学び帳の <code>colorfulDiaries</code> を見つけた場合、IndexedDBへコピーできます。コピーだけでは旧データを消しません。</p>
<div id="legacyStatus" class="status">確認中…</div>
<div class="toolbar"><button onclick="migrateLegacy()">📥 旧日記を取り込む</button><button onclick="exportJson()">💾 日記バックアップ</button><button class="danger" onclick="removeLegacy()">🧹 移行後に旧データを削除</button></div>
<p class="hint">※ 同じGitHub Pagesのドメインなら旧データを直接検出できます。別ドメインの場合はJSONバックアップの読み込みを使ってください。</p>
</section>

<section id="writeView" class="box">
<h2 id="formTitle">✏️ 今日の日記</h2>
<div class="grid">
<div><label for="date">日付</label><input id="date" type="date"></div>
<div><label for="mood">今日の気分</label><select id="mood"><option>😊</option><option>😌</option><option>😄</option><option>😐</option><option>😮</option><option>😓</option><option>😢</option></select></div>
<div class="full"><label for="category">ジャンル</label><select id="category"><option>日常</option><option>仕事・勉強</option><option>おでかけ</option><option>趣味</option><option>人との出来事</option><option>その他</option></select></div>
<div class="full"><label for="body">本文</label><textarea id="body" placeholder="今日あったこと、思ったことを自由に。"></textarea></div>
<div class="full"><label for="image">写真（任意・最大3枚）</label><input id="image" type="file" accept="image/*" multiple><p class="hint">保存前に最大1280px・JPEG品質0.72へ自動圧縮します。保存先はIndexedDBです。</p><div id="preview" class="photoPreview"></div></div>
</div>
<div class="toolbar"><button class="primary wide" id="saveBtn" onclick="saveDiary()">💾 日記を保存する</button><button id="cancelBtn" style="display:none" onclick="cancelEdit()">✖ 編集をやめる</button></div><div id="msg" class="msg"></div>
</section>

<section id="listView" class="box">
<h2>📚 日記一覧 <span id="count" class="count"></span></h2>
<div class="filters noPrint"><div><label>ジャンル</label><select id="filter"><option>すべて</option><option>日常</option><option>仕事・勉強</option><option>おでかけ</option><option>趣味</option><option>人との出来事</option><option>その他</option></select></div><div><label>表示</label><select id="favoriteOnly"><option value="0">すべて</option><option value="1">★ お気に入りだけ</option></select></div></div>
<div class="toolbar noPrint"><button onclick="window.print()">📄 日記をまとめてPDF</button><button onclick="exportJson()">⬇️ JSONを書き出す</button><label class="linkbtn" for="importFile">⬆️ JSONを読み込む</label><input id="importFile" type="file" accept=".json,application/json" style="display:none"></div>
<div id="list"></div>
</section>
</main>
<script>
const DB_NAME='colorfulDiaryDB'; const STORE='diaries'; const DB_VERSION=1; let db; let editingId=null; let photos=[];
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('date','date')}};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function all(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(x){return new Promise((res,rej)=>{const r=tx('readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function setToday(){if(!$('date').value){const d=new Date(),z=n=>String(n).padStart(2,'0');$('date').value=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}}
function showView(v){$('writeView').style.display=v==='write'?'block':'none';$('listView').style.display=v==='list'?'block':'none';if(v==='list')render();window.scrollTo({top:0,behavior:'smooth'})}
function photosOf(d){if(Array.isArray(d.photos))return d.photos.filter(Boolean).slice(0,3);return d.image?[d.image]:[]}
function renderPreview(){$('preview').innerHTML=photos.map((p,i)=>`<div><img src="${p}"><button onclick="removePhoto(${i})">✖ 外す</button></div>`).join('')}
function removePhoto(i){photos.splice(i,1);renderPreview()}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,max=1280;if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
$('image').addEventListener('change',async e=>{const fs=[...(e.target.files||[])],room=Math.max(0,3-photos.length);if(!room){alert('写真は3枚までです。');e.target.value='';return}$('msg').textContent='写真を圧縮しています…';try{for(const f of fs.slice(0,room))photos.push(await compress(f));renderPreview();$('msg').textContent='写真を追加しました。'}catch(err){console.error(err);$('msg').textContent='写真を読み込めませんでした。'}e.target.value=''})
async function saveDiary(){const date=$('date').value,body=$('body').value.trim();if(!date){$('msg').textContent='日付を選んでください。';return}if(!body&&!photos.length){$('msg').textContent='本文か写真のどちらかを残してみましょう。';return}let old=null;if(editingId!=null){old=(await all()).find(x=>Number(x.id)===Number(editingId))}const item={id:editingId??Date.now(),date,mood:$('mood').value,category:$('category').value,text:body,photos:[...photos],favorite:old?!!old.favorite:false};await put(item);$('msg').textContent=editingId==null?'保存しました！':'更新しました！';resetForm();await render();showView('list')}
function resetForm(){editingId=null;photos=[];$('body').value='';$('image').value='';renderPreview();$('saveBtn').textContent='💾 日記を保存する';$('cancelBtn').style.display='none';$('formTitle').textContent='✏️ 今日の日記';$('date').value='';setToday()}
function cancelEdit(){resetForm();$('msg').textContent='編集をやめました。'}
async function editDiary(id){const d=(await all()).find(x=>Number(x.id)===Number(id));if(!d)return;editingId=d.id;$('date').value=d.date||'';$('mood').value=d.mood||'😊';$('category').value=d.category||'その他';$('body').value=d.text||'';photos=photosOf(d);renderPreview();$('saveBtn').textContent='💾 日記を更新する';$('cancelBtn').style.display='inline-block';$('formTitle').textContent='✏️ 日記を編集';showView('write')}
async function toggleFavorite(id){const d=(await all()).find(x=>Number(x.id)===Number(id));if(!d)return;d.favorite=!d.favorite;await put(d);render()}
async function deleteDiary(id){if(!confirm('この日記を削除しますか？'))return;await del(id);if(editingId===id)resetForm();render()}
async function printOne(id){const d=(await all()).find(x=>Number(x.id)===Number(id));if(!d)return;const w=open('','_blank');w.document.write(printHtml([d],`カラフル日記_${d.date||'記録'}`));w.document.close()}
function printHtml(items,title){return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:sans-serif;max-width:900px;margin:auto;padding:24px;color:#222}article{break-inside:avoid;border-bottom:1px solid #bbb;padding:18px 0}.meta{color:#666}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;max-height:280px;object-fit:contain}p{white-space:pre-wrap}</style></head><body><h1>📔 ${esc(title)}</h1>${items.map(d=>`<article><h2>${esc(d.date)} ${esc(d.mood)}</h2><div class="meta">${esc(d.category)}${d.favorite?' ／ ★お気に入り':''}</div>${photosOf(d).length?`<div class="photos">${photosOf(d).map(p=>`<img src="${p}">`).join('')}</div>`:''}<p>${esc(d.text)}</p></article>`).join('')}<script>onload=()=>setTimeout(()=>print(),300)<\/script></body></html>`}
async function render(){let a=await all();a.sort((x,y)=>(y.date||'').localeCompare(x.date||'')||Number(y.id)-Number(x.id));const f=$('filter').value,fo=$('favoriteOnly').value==='1';a=a.filter(d=>(f==='すべて'||(d.category||'その他')===f)&&(!fo||d.favorite));$('count').textContent=`（${a.length}件）`;if(!a.length){$('list').innerHTML='<p class="hint">まだ日記はありません。</p>';return}$('list').innerHTML=a.map(d=>`<article class="card ${d.favorite?'favorite':''}"><h3>${d.favorite?'★ ':''}${esc(d.date)}　${esc(d.mood)}</h3><div class="meta">${esc(d.category||'その他')}</div>${d.text?`<div class="body">${esc(d.text)}</div>`:''}${photosOf(d).length?`<div class="photos">${photosOf(d).map(p=>`<img src="${p}" alt="日記写真">`).join('')}</div>`:''}<div class="toolbar noPrint"><button onclick="toggleFavorite(${Number(d.id)})">${d.favorite?'★ お気に入り':'☆ お気に入り'}</button><button onclick="editDiary(${Number(d.id)})">✏️ 編集</button><button onclick="printOne(${Number(d.id)})">📄 PDF</button><button class="danger" onclick="deleteDiary(${Number(d.id)})">🗑️ 削除</button></div></article>`).join('')}
$('filter').addEventListener('change',render);$('favoriteOnly').addEventListener('change',render);
function download(name,text){const b=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function exportJson(){const entries=await all();download(`colorful-diary-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'colorful-diary',version:1,exportedAt:new Date().toISOString(),entries},null,2))}
function extractEntries(payload){if(Array.isArray(payload))return payload;if(Array.isArray(payload?.entries))return payload.entries;const candidates=[payload?.colorfulDiaries,payload?.storage?.colorfulDiaries,payload?.data?.colorfulDiaries];for(const c of candidates){if(Array.isArray(c))return c;if(typeof c==='string'){try{const a=JSON.parse(c);if(Array.isArray(a))return a}catch{}}}return null}
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text()),entries=extractEntries(p);if(!entries)throw new Error('日記データが見つかりません');if(!confirm(`${entries.length}件の日記を読み込みます。既存と同じIDは上書きされます。よろしいですか？`))return;for(const d of entries){const item={...d,id:Number(d.id)||Date.now()+Math.random(),photos:photosOf(d)};delete item.image;await put(item)}alert('読み込みました。');await render()}catch(err){alert('読み込みに失敗しました：'+err.message)}finally{e.target.value=''}})
function legacyEntries(){try{const raw=localStorage.getItem('colorfulDiaries');if(!raw)return[];const a=JSON.parse(raw);return Array.isArray(a)?a:[]}catch{return[]}}
async function updateLegacyStatus(){const a=legacyEntries(),current=await all();$('legacyStatus').innerHTML=a.length?`旧日記を <b>${a.length}件</b> 検出しました。現在の新日記：<b>${current.length}件</b>。`:`旧 <code>colorfulDiaries</code> は見つかりません。現在の新日記：<b>${current.length}件</b>。`}
async function migrateLegacy(){const a=legacyEntries();if(!a.length){alert('旧日記は見つかりませんでした。');return}if(!confirm(`${a.length}件を新しい日記保存先へコピーします。旧データはまだ削除しません。よろしいですか？`))return;for(const d of a){const item={...d,id:Number(d.id)||Date.now()+Math.random(),photos:photosOf(d)};delete item.image;await put(item)}await render();await updateLegacyStatus();alert('移行コピーが完了しました。日記が表示されることを確認してから旧データを削除してください。')}
async function removeLegacy(){const a=legacyEntries();if(!a.length){alert('削除する旧日記はありません。');return}const current=await all();if(current.length<a.length){alert('新しい日記側の件数が旧日記より少ないため削除を止めました。先に「旧日記を取り込む」を実行してください。');return}if(!confirm(`旧localStorageの日記 ${a.length}件を削除します。新しいIndexedDB側の日記は消えません。念のため先に「日記バックアップ」を保存することをおすすめします。削除しますか？`))return;localStorage.removeItem('colorfulDiaries');await updateLegacyStatus();alert('旧日記データを削除しました。ダンダン学び帳のlocalStorage容量が軽くなります。')}
(async()=>{try{db=await openDb();setToday();await render();await updateLegacyStatus();showView('list')}catch(e){console.error(e);alert('日記データベースを開けませんでした。ブラウザの設定を確認してください。')}})();
</script>
</body></html>
